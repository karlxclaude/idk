<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05010d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>EVERHUNGER</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #05010d; color: #fff;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #ui-root .interactive { pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
